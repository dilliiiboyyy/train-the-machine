    <script>
      // Filter benign Emscripten / TFLite WASM stderr logs
      (function() {
        function isTFLiteNoise(args) {
          for (var i = 0; i < args.length; i++) {
            var item = String(args[i]);
            if (
              item.indexOf('TensorFlow Lite') !== -1 ||
              item.indexOf('XNNPACK') !== -1 ||
              item.indexOf('Created TensorFlow Lite XNNPACK delegate') !== -1
            ) {
              return true;
            }
          }
          return false;
        }

        ['error', 'warn', 'info', 'log'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            if (isTFLiteNoise(arguments)) {
              return; // Silently swallow - do not output to any console stream
            }
            return orig.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(event) {
          if (event && event.message && isTFLiteNoise([event.message])) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
